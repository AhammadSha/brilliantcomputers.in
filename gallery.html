<script>
document.querySelectorAll('.gallerySlider').forEach(slider => {

	const track = slider.querySelector('.galleryTrack');
	const next  = slider.querySelector('.next');
	const prev  = slider.querySelector('.prev');

	const cardWidth = () => { return track.querySelector('.galleryCard').offsetWidth + 16; };

	// NEXT BUTTON
	next.addEventListener('click', () => { moveNext(); });

	// PREV BUTTON
	prev.addEventListener('click', () => {
		if (track.scrollLeft <= 0) {
			track.scrollTo({
				left: track.scrollWidth,
				behavior: 'smooth'
			});
		} else {
			track.scrollBy({
				left: -cardWidth(),
				behavior: 'smooth'
			});
		}
	});

	// AUTO MOVE
	function moveNext() {
		track.scrollBy({
			left: cardWidth(),
			behavior: 'smooth'
		});
		// Infinite Loop
		setTimeout(() => {
			if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 5) {
				track.scrollTo({
					left: 0,
					behavior: 'smooth'
				});
			}
		}, 1000);
	}
	// AUTO SLIDE EVERY 3 SEC
	let autoSlide = setInterval(moveNext, 3000);
	// STOP ON HOVER
	slider.addEventListener('mouseenter', () => { clearInterval(autoSlide); });
	// START AGAIN
	slider.addEventListener('mouseleave', () => { autoSlide = setInterval(moveNext, 3000); });

});
</script>
