<script>

function courseSelect(select) {
  var value = select.value;

  var tabcontent = document.getElementsByClassName("course_box_");
  for (var i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }

  document.getElementById(value).style.display = "block";
}
</script>


<script>
function course(evt, cityName) {
  var i, tabcontent, tablinks;
  tabcontent = document.getElementsByClassName("course_box_");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  tablinks = document.getElementsByClassName("courseBtn");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }
  document.getElementById(cityName).style.display = "block";
  evt.currentTarget.className += " active";
}

// Get the element with id="defaultOpen" and click on it
document.getElementById("dOn").click();
</script>
